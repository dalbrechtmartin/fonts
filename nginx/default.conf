server {
    listen 8080 default_server;
    root /usr/share/nginx/html;

    # Derrière Traefik : redirections relatives, sans le port interne
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;

    # Polices et leurs CSS : chargées par d'autres sites (@import), d'où l'accès CORS
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Pages : toujours revalidées, pour voir un nouveau déploiement tout de suite
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
