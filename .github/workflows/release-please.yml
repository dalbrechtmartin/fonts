name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Un job par police publiée : la compiler à sa nouvelle version et joindre son zip à la release
  assets:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Compiler, vérifier et joindre le zip de la police
        env:
          GH_TOKEN: ${{ github.token }}
          CHEMIN_POLICE: ${{ matrix.path }}
        run: |
          id_police="$(basename "$CHEMIN_POLICE")"
          python tools/polices.py construire "$id_police"
          python tools/polices.py verifier "$id_police"
          python tools/polices.py empaqueter "$id_police" --sortie release
          gh release upload "$(python tools/polices.py tag "$id_police")" release/*.zip --clobber
