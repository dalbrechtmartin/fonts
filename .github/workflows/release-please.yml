name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One job per released font: build it at its new version and attach the zip
  # (TTF + WOFF2 + licence + changelog) to its GitHub release.
  assets:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Build, check and attach the font zip
        env:
          GH_TOKEN: ${{ github.token }}
          FONT_PATH: ${{ matrix.path }}
        run: |
          id="$(basename "$FONT_PATH")"
          python tools/fonts.py build "$id"
          python tools/fonts.py check "$id"
          python tools/fonts.py package "$id" --out release
          gh release upload "$(python tools/fonts.py tag "$id")" release/*.zip --clobber
