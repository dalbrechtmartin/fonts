name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Un job par police publiée : la compiler à sa nouvelle version, joindre son zip à la release et la publier sur npm
  assets:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-latest
    # id-token : jeton OIDC du trusted publishing npm (provenance générée par npm), sans secret
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Compiler, vérifier et joindre le zip de la police
        env:
          GH_TOKEN: ${{ github.token }}
          CHEMIN_POLICE: ${{ matrix.path }}
        run: |
          id_police="$(basename "$CHEMIN_POLICE")"
          python tools/polices.py construire "$id_police"
          python tools/polices.py verifier "$id_police"
          python tools/polices.py empaqueter "$id_police" --sortie release
          gh release upload "$(python tools/polices.py tag "$id_police")" release/*.zip --clobber

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publier le paquet npm de la police
        env:
          CHEMIN_POLICE: ${{ matrix.path }}
        run: |
          id_police="$(basename "$CHEMIN_POLICE")"
          python tools/polices.py npm "$id_police"
          npm publish "./npm/$id_police" --access public
