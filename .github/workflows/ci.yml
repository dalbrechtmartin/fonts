name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Mêmes commandes qu'en local : compiler, vérifier (noms, graisses, spécimen, version), générer le site
      - run: python tools/polices.py construire

      - run: python tools/polices.py verifier

      - run: python tools/polices.py site
