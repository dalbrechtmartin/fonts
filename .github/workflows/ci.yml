name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Même lint que le hook pre-commit, sur tout le dépôt
      - run: ruff check .

      # Mêmes commandes qu'en local : compiler, vérifier (noms, graisses, spécimen, version), générer le site
      - run: python tools/polices.py construire

      - run: python tools/polices.py verifier

      - run: python tools/polices.py site
