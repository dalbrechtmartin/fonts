name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Même lint que le hook pre-commit, sur tout le dépôt
      - run: ruff check .

      # Mêmes commandes qu'en local : compiler, vérifier (noms, graisses, spécimen, version), générer le site
      - run: python tools/polices.py construire

      - run: python tools/polices.py verifier

      - run: python tools/polices.py site
